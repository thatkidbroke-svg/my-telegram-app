<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Моя Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f9f9f9; 
      color: #333;
    }
    h2 { margin-top: 0; color: #1a73e8; }
    button {
      padding: 14px 28px;
      font-size: 18px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #0d5bb8; }
  </style>
</head>
<body>
  <h2>🎮 Привет из Mini App!</h2>
  <p>Это твоё первое приложение внутри Telegram.</p>
  <button onclick="sendData()">Отправить результат боту</button>

  <script>
    function sendData() {
      const tg = window.Telegram.WebApp;
      tg.sendData(JSON.stringify({ action: "mini_app_test", result: "success" }));
      tg.close();
    }

    // Опционально: расширить окно на весь экран
    window.Telegram.WebApp.expand();
  </script>
</body>
</html>
