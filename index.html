<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моя Mini App</title>
  <!-- Обязательный скрипт Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #3399ff;
    }
    p {
      font-size: 16px;
      margin-bottom: 24px;
      color: #555;
    }
    .btn {
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      max-width: 300px;
    }
    .btn:hover {
      background: #1a73e8;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Добро пожаловать!</h1>
    <p>Это твоя первая Telegram Mini App.<br/>Нажми кнопку, чтобы отправить данные в бота.</p>
    <button class="btn" onclick="sendData()">Отправить результат</button>
    <div class="footer">Работает внутри Telegram</div>
  </div>

  <script>
    // Ждём полной загрузки Telegram WebApp
    window.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram.WebApp;

      // Расширяем приложение на весь экран (рекомендуется)
      tg.expand();

      // Убираем стандартную кнопку "Закрыть", если нужно (опционально)
      // tg.MainButton.setText('Отправить').show();

      // Функция отправки данных в бота
      window.sendData = function() {
        // Передаём любые данные в формате JSON-строки
        const payload = {
          action: "mini_app_used",
          timestamp: Date.now(),
          user_id: tg.initDataUnsafe?.user?.id || null
        };

        // Отправляем данные в чат с ботом
        tg.sendData(JSON.stringify(payload));

        // Закрываем Mini App
        tg.close();
      };
    });
  </script>
</body>
</html>
